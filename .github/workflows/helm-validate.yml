name: "Helm Chart Validation"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/helm-validate.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: helm-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: "4.1.0"
  KUBERNETES_VERSION: "1.30.0"

jobs:
  discover:
    name: Discover Changed Charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.find-charts.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed charts
        id: find-charts
        run: |
          # Get list of changed files in charts/ directory
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- charts/)

          if [ -z "$changed_files" ]; then
            echo "No chart files changed"
            echo "charts=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract unique chart directories from changed files
          # Only include directories that contain a Chart.yaml file (excluding subchart dependencies)
          chart_dirs=$(echo "$changed_files" | \
            grep "^charts/" | \
            cut -d/ -f1-2 | \
            sort -u | \
            while read dir; do
              if [ -f "$dir/Chart.yaml" ] && [[ ! "$dir" =~ /charts/ ]]; then
                echo "$dir"
              fi
            done)

          if [ -z "$chart_dirs" ]; then
            echo "No valid charts changed"
            echo "charts=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Convert to JSON array
          charts=$(echo "$chart_dirs" | jq -R -s -c 'split("\n")[:-1]')
          echo "charts=$charts" >> $GITHUB_OUTPUT
          echo "Found changed charts:"
          echo "$charts" | jq -r '.[]'

  lint:
    name: Lint Chart
    needs: discover
    if: needs.discover.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Update dependencies
        run: |
          if [ -f "${{ matrix.chart }}/Chart.yaml" ]; then
            if grep -q "dependencies:" "${{ matrix.chart }}/Chart.yaml"; then
              echo "Updating dependencies for ${{ matrix.chart }}"
              helm dependency update "${{ matrix.chart }}"
            fi
          fi

      - name: Lint chart
        run: |
          echo "Linting ${{ matrix.chart }}"
          helm lint "${{ matrix.chart }}" --strict

  template:
    name: Template Chart
    needs: discover
    if: needs.discover.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Update dependencies
        run: |
          if [ -f "${{ matrix.chart }}/Chart.yaml" ]; then
            if grep -q "dependencies:" "${{ matrix.chart }}/Chart.yaml"; then
              echo "Updating dependencies for ${{ matrix.chart }}"
              helm dependency update "${{ matrix.chart }}"
            fi
          fi

      - name: Template chart with default values
        run: |
          echo "Templating ${{ matrix.chart }} with default values"
          helm template test-release "${{ matrix.chart }}" > /dev/null

      - name: Template chart with example values (if exists)
        run: |
          if [ -f "${{ matrix.chart }}/values-example.yaml" ]; then
            echo "Templating ${{ matrix.chart }} with example values"
            helm template test-release "${{ matrix.chart }}" -f "${{ matrix.chart }}/values-example.yaml" > /dev/null
          else
            echo "No example values file found, skipping"
          fi

  kubeconform:
    name: Validate Kubernetes Manifests
    needs: discover
    if: needs.discover.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Update dependencies
        run: |
          if [ -f "${{ matrix.chart }}/Chart.yaml" ]; then
            if grep -q "dependencies:" "${{ matrix.chart }}/Chart.yaml"; then
              echo "Updating dependencies for ${{ matrix.chart }}"
              helm dependency update "${{ matrix.chart }}"
            fi
          fi

      - name: Validate manifests with kubeconform
        run: |
          echo "Validating ${{ matrix.chart }} manifests against Kubernetes ${{ env.KUBERNETES_VERSION }}"
          helm template test-release "${{ matrix.chart }}" | \
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version "${{ env.KUBERNETES_VERSION }}" \
              -summary \
              -output json

  verify-metadata:
    name: Verify Chart Metadata
    needs: discover
    if: needs.discover.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Chart.yaml
        run: |
          chart_yaml="${{ matrix.chart }}/Chart.yaml"
          echo "Verifying $chart_yaml"

          # Check required fields
          for field in name version description; do
            if ! grep -q "^$field:" "$chart_yaml"; then
              echo "ERROR: Missing required field '$field' in $chart_yaml"
              exit 1
            fi
          done

          # Check version format (semantic versioning)
          version=$(grep "^version:" "$chart_yaml" | awk '{print $2}')
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "ERROR: Version '$version' does not follow semantic versioning"
            exit 1
          fi

          echo "Chart metadata validation passed"

      - name: Verify values.yaml exists
        run: |
          if [ ! -f "${{ matrix.chart }}/values.yaml" ]; then
            echo "ERROR: Missing values.yaml in ${{ matrix.chart }}"
            exit 1
          fi
          echo "values.yaml exists"

      - name: Verify values.yaml is valid YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('${{ matrix.chart }}/values.yaml'))"
          echo "values.yaml is valid YAML"

  unit-tests:
    name: Run Unit Tests
    needs: discover
    if: needs.discover.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Check if tests exist
        id: check-tests
        run: |
          if [ -d "${{ matrix.chart }}/tests" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "Tests directory found for ${{ matrix.chart }}"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "No tests directory found for ${{ matrix.chart }}, skipping"
          fi

      - name: Run unit tests
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          echo "Running unit tests for ${{ matrix.chart }}"
          helm unittest "${{ matrix.chart }}" --color

  summary:
    name: Validation Summary
    needs: [lint, template, kubeconform, verify-metadata, unit-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.template.result }}" != "success" ] || \
             [ "${{ needs.kubeconform.result }}" != "success" ] || \
             [ "${{ needs.verify-metadata.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "One or more validation steps failed"
            exit 1
          fi
          echo "All validation steps passed successfully"
