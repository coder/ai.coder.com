extra:
  secretStore:
    labels: {}
    annotations: {}
    aws:
      region: us-east-1

kube-state-metrics:
  enabled: false
  affinity: {}
  tolerations: []

postgres-exporter:
  enabled: false
  affinity: {}
  tolerations: []
  config:
    datasource:
      host: ''
      user: 'pg_readonly'
      port: 5432
      sslmode: disable
      passwordSecret:
        labels: {}
        annotations: {}
        refreshInterval: 1h0m0s
        refreshPolicy: Periodic
        secretArn: arn:aws:secretsmanager:us-east-1:123456789012:secret:coder-abc123
        name: 'coder-abc123'
        key: password
      database: ''

node-exporter:
  enabled: false
  affinity: {}
  tolerations: []

grafana-agent:
  enabled: false

  controller:
    type: daemonset
    podAnnotations: {}
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: "100%"
    affinity: {}
    tolerations: []
    
  agent: 
    mode: flow
    configMap:
      create: true
      content: ''

    clustering:
      enabled: true
    
    extraArgs:
      - "--disable-reporting=true"
    
    mounts:
      varlog: true
      dockercontainers: true

  serviceAccount:
    create: true
    annotations: {}

  crds:
    create: true
  
  withOTLPReceiver: false

  discovery: ""

  extraBlocks: ""
  podMetricsRelabelRules: ""
  podLogsRelabelRules: ""

  commonRelabellings: ""

loki:
  enabled: false
  loki:
    auth_enabled: false
  minio:
    enabled: false
  rollout_operator:
    enabled: false